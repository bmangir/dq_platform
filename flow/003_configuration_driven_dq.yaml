table: orders

checks:

  - name: order_id_not_null
    type: not_null
    column: order_id
    severity: critical

  - name: order_id_unique
    type: unique
    column: order_id
    severity: critical

  - name: order_amount_positive
    type: range
    column: order_amount
    min: 0
    severity: critical

  - name: order_status_valid
    type: allowed_values
    column: order_status
    values:
      - pending
      - completed
      - cancelled
    severity: warning

  - name: order_date_valid
    type: date_range
    column: order_date
    max: today
    severity: critical