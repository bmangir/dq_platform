table: public.orders

checks:

  - name: order_id_not_null
    type: not_null
    column: order_id
    severity: critical

  - name: orders_row_count
    type: row_count
    severity: high
    threshold:
      min: 1
      max: 100000

  - name: order_id_unique
    type: unique
    column: order_id
    severity: high